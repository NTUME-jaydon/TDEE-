<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>補給站</title>
<meta name="description" content="每日熱量與三大營養素紀錄">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="補給站">
<meta name="theme-color" content="#EEF2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1729" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg: #EEF2F6; --surface: #FFFFFF; --surface-2: #F5F7FA;
  --ink: #13203B; --muted: #5D6B82; --line: #D5DCE6;
  --lane: #DCE3EE; --infield: #D7EDDD; --infield-ink: #1F5133; --finish: #FFFFFF;
  --kcal: #2D5BD3; --protein: #E2556F; --carbs: #D9951F; --fat: #1E9AA0;
  --warn: #C2410C;
  --primary: #2D5BD3; --primary-ink: #FFFFFF; --danger: #B42318;
  --shadow-fab: 0 6px 18px rgba(45, 91, 211, .35);
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1729; --surface: #172238; --surface-2: #1D2A44;
    --ink: #E8EDF5; --muted: #9AA8BF; --line: #2A3853;
    --lane: #24324D; --infield: #183427; --infield-ink: #BFE5CC; --finish: #E8EDF5;
    --kcal: #6488F0; --protein: #E5627C; --carbs: #C2861F; --fat: #279FA4;
    --warn: #F08A4B;
    --primary: #3F68DD; --primary-ink: #FFFFFF; --danger: #F07A6E;
    --shadow-fab: 0 6px 18px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  --bg: #0F1729; --surface: #172238; --surface-2: #1D2A44;
  --ink: #E8EDF5; --muted: #9AA8BF; --line: #2A3853;
  --lane: #24324D; --infield: #183427; --infield-ink: #BFE5CC; --finish: #E8EDF5;
  --kcal: #6488F0; --protein: #E5627C; --carbs: #C2861F; --fat: #279FA4;
  --warn: #F08A4B;
  --primary: #3F68DD; --primary-ink: #FFFFFF; --danger: #F07A6E;
  --shadow-fab: 0 6px 18px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--primary); }
p { margin: 8px 0; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.num { font-family: "Barlow Condensed", "PingFang TC", sans-serif; font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); }
[hidden] { display: none !important; }

main {
  max-width: 560px; margin: 0 auto;
  padding: calc(8px + env(safe-area-inset-top)) 16px calc(var(--tabbar-h) + 100px + env(safe-area-inset-bottom));
}
h1 { font-size: 26px; font-weight: 700; margin: 12px 2px 4px; }

/* ---------- Today ---------- */
.day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.icon-btn {
  width: 44px; height: 44px; flex: none; border: 0; background: transparent; border-radius: 50%;
  display: grid; place-items: center; color: var(--muted);
}
.icon-btn:active { background: var(--surface-2); }
.date-title { border: 0; background: transparent; text-align: center; padding: 4px 8px; }
.date-title strong { display: block; font-size: 20px; font-weight: 650; }
.date-title span { font-size: 13px; color: var(--muted); }

.banner {
  background: var(--surface); border-left: 4px solid var(--primary); border-radius: 8px;
  padding: 10px 14px; margin: 8px 0 4px; font-size: 14px;
}
.link { border: 0; background: none; padding: 0; color: var(--primary); font-weight: 600; text-decoration: underline; }

.track { display: block; width: 100%; max-width: 420px; height: auto; margin: 6px auto 0; }
.lane-base { fill: none; stroke: var(--lane); stroke-width: 12; }
.lane-fill {
  fill: none; stroke-width: 12; stroke-linecap: round;
  transition: stroke-dashoffset .9s cubic-bezier(.2, .7, .2, 1), opacity .3s;
}
.infield { fill: var(--infield); }
.finish { fill: var(--finish); }
.t-label { font-size: 13px; font-weight: 600; fill: var(--infield-ink); text-anchor: middle; }
.t-big { font-size: 46px; font-weight: 700; fill: var(--infield-ink); text-anchor: middle; }
.t-unit { font-size: 12px; fill: var(--infield-ink); text-anchor: middle; opacity: .85; }
.track.over .t-label, .track.over .t-big { fill: var(--warn); }

.summary { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
.summary b { color: var(--ink); font-size: 17px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; }

.macros { background: var(--surface); border-radius: 12px; padding: 2px 14px; }
.macro {
  display: grid; grid-template-columns: 12px 1fr auto; grid-template-rows: auto auto;
  column-gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line);
}
.macro:last-child { border-bottom: 0; }
.macro .m-name { font-weight: 600; }
.macro .m-val { font-size: 18px; color: var(--muted); text-align: right; }
.macro .m-val b { color: var(--ink); font-size: 20px; font-weight: 600; }
.macro .m-bar { grid-column: 2 / -1; height: 4px; border-radius: 2px; background: var(--lane); overflow: hidden; margin-top: 6px; }
.macro .m-bar i { display: block; height: 100%; border-radius: 2px; }
.macro .m-left { grid-column: 2 / -1; font-size: 13px; color: var(--muted); margin-top: 2px; }
.m-left.over { color: var(--warn); font-weight: 600; }
.m-left.done { color: var(--ink); font-weight: 600; }

.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 2px 8px; }
.section-title h2 { font-size: 17px; font-weight: 650; margin: 0; }
.section-title .num { color: var(--muted); font-size: 17px; }

.list { background: var(--surface); border-radius: 12px; overflow: hidden; }
.entry {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
  width: 100%; text-align: left; border: 0; background: transparent;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.entry:last-child { border-bottom: 0; }
.entry:active { background: var(--surface-2); }
.e-name { font-weight: 600; overflow-wrap: anywhere; }
.e-kcal { font-size: 21px; font-weight: 600; text-align: right; white-space: nowrap; }
.e-kcal small { font-size: 13px; color: var(--muted); font-weight: 500; }
.e-sub {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px;
  font-size: 13px; color: var(--muted);
}
.tag {
  display: inline-block; font-size: 12px; line-height: 18px; padding: 0 7px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.tag.est { border-style: dashed; border-color: var(--muted); }
.tag.solid { background: var(--surface-2); color: var(--ink); }

.empty { background: var(--surface); border-radius: 12px; padding: 20px 18px; text-align: center; color: var(--muted); }
.empty .btn { margin-top: 12px; }

.week { padding: 8px 6px 2px; }
.week svg { display: block; width: 100%; height: auto; }
.w-base { stroke: var(--line); stroke-width: 1; }
.w-target { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.w-tlabel { font-size: 12px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.w-bar { fill: var(--kcal); }
.w-bar.dim { opacity: .4; }
.w-val { font-size: 14px; font-weight: 600; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.w-label { font-size: 12px; fill: var(--muted); text-anchor: middle; }
.w-label.sel { fill: var(--ink); font-weight: 700; }
.w-day { cursor: pointer; outline: none; }
.w-day:focus-visible .w-label { fill: var(--primary); text-decoration: underline; }

/* ---------- Tab bar & FAB ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; font-size: 12px; color: var(--muted);
}
.tab[aria-current="page"] { color: var(--primary); font-weight: 600; }
.fab {
  position: fixed; z-index: 21;
  right: max(16px, calc(50% - 280px + 16px));
  bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom));
  width: 60px; height: 60px; border-radius: 50%; border: 0;
  background: var(--primary); color: var(--primary-ink); box-shadow: var(--shadow-fab);
  display: grid; place-items: center;
}
.fab:active { transform: scale(.96); }

/* ---------- Sheets ---------- */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8, 15, 30, .45); opacity: 0; transition: opacity .22s; }
.backdrop.show { opacity: 1; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
  max-height: 90vh; max-height: calc(100dvh - 32px);
  background: var(--surface); border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.sheet.show { transform: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 6px 4px 18px; }
.sheet-head h2 { font-size: 19px; font-weight: 700; margin: 0; outline: none; overflow-wrap: anywhere; }
.sheet-body { overflow: auto; -webkit-overflow-scrolling: touch; padding: 2px 18px calc(22px + env(safe-area-inset-bottom)); }
.sub { font-size: 15px; font-weight: 650; margin: 20px 0 8px; }

/* ---------- Controls ---------- */
.field { display: grid; gap: 4px; margin: 12px 0; }
.field .lbl, .field > label { font-size: 14px; color: var(--muted); }
input, select {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; min-height: 44px;
}
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; margin: 2px 0 0; accent-color: var(--primary); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 8px; }
.grid4 .field input { padding: 9px 8px; }

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin: 10px 0;
}
.seg button { border: 0; background: transparent; padding: 6px 2px; border-radius: 9px; font-size: 15px; min-height: 40px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: 0 1px 3px rgba(19, 32, 59, .18); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px;
  border-radius: 12px; border: 0; background: var(--primary); color: var(--primary-ink);
  font-weight: 650; font-size: 16px; text-decoration: none; padding: 0 12px;
}
.btn.secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); font-weight: 600; }
.btn.small { min-height: 44px; width: auto; font-size: 15px; }
.btn:disabled { opacity: .55; }
.btn-row { display: grid; gap: 10px; margin-top: 16px; }
.btn-row.two { grid-template-columns: 1fr 1fr; }

.options { display: grid; gap: 10px; margin-top: 4px; }
.option {
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; text-align: left;
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px 14px;
}
.option .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); color: var(--primary); }
.option strong { display: block; font-size: 16px; }
.option span span { font-size: 13px; color: var(--muted); }
.option.primary { background: var(--primary); border-color: transparent; color: var(--primary-ink); }
.option.primary span span { color: rgba(255, 255, 255, .86); }
.option.primary .ic { background: rgba(255, 255, 255, .18); color: #fff; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip .num { color: var(--muted); font-size: 15px; }

.stepper {
  display: inline-grid; grid-template-columns: 42px 76px 42px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2);
}
.stepper button { border: 0; background: transparent; height: 42px; font-size: 22px; line-height: 1; }
.stepper button:active { background: var(--line); }
.stepper output { text-align: center; font-size: 19px; font-weight: 600; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0; }

.ritem { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px 0; }
.ritem.off { opacity: .5; }
.ritem-head { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; }
.ritem-meta { font-size: 13px; color: var(--muted); }
.ritem-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.ritem-kcal { font-size: 22px; font-weight: 600; }
details { margin-top: 8px; }
summary { font-size: 14px; color: var(--primary); font-weight: 600; cursor: pointer; padding: 4px 0; }
.total { font-size: 15px; text-align: right; margin: 12px 2px 0; }
.total b { font-size: 24px; }

.nut4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.nut { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.nut small { display: block; font-size: 12px; color: var(--muted); }
.nut b { font-size: 22px; font-weight: 600; }
.nut span { font-size: 12px; color: var(--muted); margin-left: 2px; }

.thumb { display: block; width: 100%; max-height: 190px; object-fit: cover; border-radius: 12px; margin: 6px 0 4px; }
.loading { text-align: center; padding-bottom: 8px; }
.lap { width: 120px; height: 64px; display: block; margin: 18px auto 6px; }
.lap-track { fill: none; stroke: var(--lane); stroke-width: 8; }
.lap-runner { fill: none; stroke: var(--primary); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 18 245; animation: run 1.3s linear infinite; }
@keyframes run { to { stroke-dashoffset: -262.8; } }

/* ---------- Settings & library ---------- */
.panel { background: var(--surface); border-radius: 14px; padding: 4px 16px 16px; margin-top: 14px; }
.panel h2 { font-size: 17px; font-weight: 650; margin: 14px 0 2px; }
.stats { display: grid; gap: 8px; margin-top: 14px; }
.stats.c2 { grid-template-columns: 1fr 1fr; }
.stats.c3 { grid-template-columns: repeat(3, 1fr); margin-top: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
.stat small { display: block; font-size: 12px; color: var(--muted); }
.stat b { font-size: 24px; font-weight: 600; }
.stat span { font-size: 13px; color: var(--muted); margin-left: 3px; }
.stat.main { background: var(--primary); color: var(--primary-ink); padding: 10px 14px; }
.stat.main small, .stat.main span { color: rgba(255, 255, 255, .88); }
.stat.main b { font-size: 34px; }
.stat .bar { display: block; height: 4px; width: 28px; border-radius: 2px; margin-bottom: 4px; }
.key-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.foot { text-align: center; margin: 22px 0 0; }
.search { margin: 12px 0 0; }

.toast {
  position: fixed; left: 50%; z-index: 60; bottom: calc(var(--tabbar-h) + 92px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  font-size: 14px; max-width: calc(100% - 32px); width: max-content; text-align: center;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .lane-fill, .sheet, .backdrop, .toast { transition: none !important; }
  .lap-runner { animation: none; stroke-dasharray: none; opacity: .6; }
}
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>

<button class="fab" id="fab" type="button" aria-label="新增餐點">
  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar" aria-label="主選單">
  <div class="tabbar-inner">
    <button class="tab" type="button" data-tab="today"><span data-icon="watch"></span>今日</button>
    <button class="tab" type="button" data-tab="library"><span data-icon="book"></span>食物庫</button>
    <button class="tab" type="button" data-tab="settings"><span data-icon="sliders"></span>設定</button>
  </div>
</nav>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="photo-input" accept="image/*" hidden>
<input type="file" id="import-input" accept="application/json,.json" hidden>

<script>
'use strict';

/* ================= 常數 ================= */
const APP = 'bujizhan';
const VERSION = '1.0';
const KEY = 'bujizhan.v1';
const KEY_API = 'bujizhan.apikey';
const DEFAULT_MODEL = 'gemini-flash-latest';
const MEALS = [['breakfast', '早餐'], ['lunch', '午餐'], ['dinner', '晚餐'], ['snack', '點心']];
const MEAL_LABEL = Object.fromEntries(MEALS);
const ACTIVITY = [
  [1.2, '久坐：幾乎不運動'],
  [1.375, '輕度：每週運動 1–3 天'],
  [1.55, '中度：每週運動 3–5 天'],
  [1.725, '高度：每週運動 6–7 天'],
  [1.9, '非常高：每天高強度訓練或勞力工作'],
];
const GOALS = [
  ['cut', '減脂', 0.8, '每天比 TDEE 少吃 20%'],
  ['slowcut', '緩慢減脂', 0.9, '每天比 TDEE 少吃 10%，比較不影響訓練'],
  ['maintain', '維持', 1.0, '吃到 TDEE，維持體重'],
  ['gain', '增肌', 1.1, '每天比 TDEE 多吃 10%'],
];
const SOURCE_LABEL = { library: '食物庫數據', label: '營養標示', ai: 'AI 估算', manual: '手動', shared: '共用' };
const WD = '日一二三四五六';

const svgIcon = (d, size = 24, sw = 2) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  chevL: svgIcon('<path d="M15 18l-6-6 6-6"/>'),
  chevR: svgIcon('<path d="M9 6l6 6-6 6"/>'),
  x: svgIcon('<path d="M6 6l12 12M18 6L6 18"/>'),
  camera: svgIcon('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  label: svgIcon('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>'),
  book: svgIcon('<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>'),
  pencil: svgIcon('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>'),
  watch: svgIcon('<circle cx="12" cy="14" r="7"/><path d="M12 14v-4M10 3h4M12 3v4M18 8l1.5-1.5"/>'),
  sliders: svgIcon('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'),
};

/* ================= 工具 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => { const x = Number(v); return Number.isFinite(x) && x > 0 ? x : 0; };
const r1 = v => Math.round((Number(v) || 0) * 10) / 10;
const fmt = v => Math.round(v || 0).toLocaleString('zh-TW');
const fmt1 = v => r1(v).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); };
const dateLabel = k => { const d = parseKey(k); return `${d.getMonth() + 1}月${d.getDate()}日 週${WD[d.getDay()]}`; };
const shortDate = k => { const d = parseKey(k); return `${d.getMonth() + 1}/${d.getDate()}`; };
function relLabel(k) {
  const t = todayKey();
  if (k === t) return '今天';
  if (k === addDays(t, -1)) return '昨天';
  if (k === addDays(t, 1)) return '明天';
  return '';
}
function defaultMeal() {
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h < 10.5) return 'breakfast';
  if (h < 14.5) return 'lunch';
  if (h < 17) return 'snack';
  if (h < 21.5) return 'dinner';
  return 'snack';
}
const cleanServing = s => String(s || '').replace(/^\s*每份\s*/, '').trim() || '1 份';
const clampPortion = p => Math.min(10, Math.max(0.25, Math.round((Number(p) || 1) * 4) / 4));

/* ================= 資料 ================= */
const defaults = () => ({
  profile: { sex: 'm', age: 30, height: 170, weight: 65, activity: 1.55, goal: 'maintain', proteinPerKg: 1.6, customKcal: null, done: false },
  settings: { model: DEFAULT_MODEL },
  foods: [],
  log: {},
});
function load() {
  const d = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return d;
    const s = JSON.parse(raw);
    return {
      profile: { ...d.profile, ...(s.profile || {}) },
      settings: { ...d.settings, ...(s.settings || {}) },
      foods: Array.isArray(s.foods) ? s.foods : [],
      log: s.log && typeof s.log === 'object' ? s.log : {},
    };
  } catch (e) { return d; }
}
let state = load();
let sharedFoods = [];
const ui = { tab: 'today', date: todayKey(), lastPct: null, lastDate: null, librarySearch: '', today: todayKey() };

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('沒辦法儲存：手機空間不足，或正在用私密瀏覽模式'); }
}
function getKey() { try { return localStorage.getItem(KEY_API) || ''; } catch (e) { return ''; } }

const allFoods = () => [...sharedFoods, ...state.foods];

/* ================= 計算 ================= */
// Mifflin-St Jeor 公式
function calcTargets(p) {
  const w = n0(p.weight), h = n0(p.height), a = n0(p.age);
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'f' ? -161 : 5);
  const tdee = bmr * (Number(p.activity) || 1.2);
  const goal = GOALS.find(g => g[0] === p.goal) || GOALS[2];
  let kcal, clamped = false, custom = false;
  if (n0(p.customKcal) > 0) { kcal = Math.round(n0(p.customKcal)); custom = true; }
  else {
    kcal = tdee * goal[2];
    if (kcal < bmr) { kcal = bmr; clamped = true; }   // 目標不低於基礎代謝
    kcal = Math.round(kcal / 10) * 10;
  }
  kcal = Math.max(kcal, 1);
  const protein = Math.round((Number(p.proteinPerKg) || 1.6) * w);
  const fat = Math.round(kcal * 0.25 / 9);            // 脂肪佔 25%
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, protein, carbs, fat, clamped, custom };
}
function entryTotals(e) {
  const p = Number(e.portion) || 1;
  return { kcal: n0(e.kcal) * p, protein: n0(e.protein) * p, carbs: n0(e.carbs) * p, fat: n0(e.fat) * p };
}
function dayTotals(k) {
  const t = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
  for (const e of state.log[k] || []) { const x = entryTotals(e); for (const f in t) t[f] += x[f]; }
  return t;
}
const macroLine = x => `蛋白 ${fmt(x.protein)}g　碳水 ${fmt(x.carbs)}g　脂肪 ${fmt(x.fat)}g`;
function addEntries(k, list) { state.log[k] = [...(state.log[k] || []), ...list]; save(); }
function recentEntries(n) {
  const seen = new Set(), out = [];
  for (const k of Object.keys(state.log).sort().reverse()) {
    const arr = [...state.log[k]].sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
    for (const e of arr) {
      const id = e.name + '|' + (e.brand || '');
      if (seen.has(id)) continue;
      seen.add(id); out.push(e);
      if (out.length >= n) return out;
    }
  }
  return out;
}

/* ================= 跑道圖 ================= */
// 外圈熱量，內三圈蛋白質、碳水、脂肪；逆時針跑，從終點線出發
const TR = { cx: 170, cy: 116, half: 54, r0: 106, step: 16 };
function stadium(r, t = TR) {
  const x1 = t.cx - t.half, x2 = t.cx + t.half;
  return `M${x2} ${t.cy + r}A${r} ${r} 0 0 0 ${x2} ${t.cy - r}L${x1} ${t.cy - r}A${r} ${r} 0 0 0 ${x1} ${t.cy + r}Z`;
}
const stadiumLen = (r, t = TR) => 4 * t.half + 2 * Math.PI * r;
function trackSVG(t, tot, pct, from) {
  const over = tot.kcal > t.kcal;
  const lanes = [['kcal', over ? 'var(--warn)' : 'var(--kcal)'], ['protein', 'var(--protein)'], ['carbs', 'var(--carbs)'], ['fat', 'var(--fat)']];
  let base = '', fill = '';
  lanes.forEach(([key, color], i) => {
    const r = TR.r0 - TR.step * i, d = stadium(r), L = stadiumLen(r);
    const to = Math.min(1, Math.max(0, pct[key] || 0)), fr = Math.min(1, Math.max(0, from[key] || 0));
    base += `<path class="lane-base" d="${d}"/>`;
    if (to > 0 || fr > 0) {
      fill += `<path class="lane-fill" d="${d}" stroke="${color}" style="stroke-dasharray:${L.toFixed(1)} ${L.toFixed(1)};stroke-dashoffset:${(L * (1 - fr)).toFixed(1)}" data-to="${(L * (1 - to)).toFixed(1)}" data-zero="${to === 0 ? 1 : 0}"/>`;
    }
  });
  const rIn = TR.r0 - TR.step * 3 - 10;
  const y1 = TR.cy + TR.r0 - TR.step * 3 - 6, y2 = TR.cy + TR.r0 + 8;
  const left = Math.abs(t.kcal - tot.kcal);
  return `<svg class="track${over ? ' over' : ''}" viewBox="0 0 340 232" role="img" aria-label="熱量 ${fmt(tot.kcal)} / ${fmt(t.kcal)} 大卡，蛋白質 ${fmt(tot.protein)} / ${t.protein} 克，碳水 ${fmt(tot.carbs)} / ${t.carbs} 克，脂肪 ${fmt(tot.fat)} / ${t.fat} 克">
    ${base}
    <path class="infield" d="${stadium(rIn)}"/>
    ${fill}
    <rect class="finish" x="${TR.cx + TR.half - 1.5}" y="${y1}" width="3" height="${y2 - y1}" rx="1"/>
    <text class="t-label" x="170" y="95">${over ? '⚠ 已超出' : '還可以吃'}</text>
    <text class="t-big num" x="170" y="138">${fmt(left)}</text>
    <text class="t-unit" x="170" y="155">kcal</text>
  </svg>`;
}

/* ================= 畫面：今日 ================= */
function renderToday(v) {
  const k = ui.date, t = calcTargets(state.profile), tot = dayTotals(k);
  const entries = state.log[k] || [];
  const pct = {
    kcal: tot.kcal / t.kcal,
    protein: t.protein ? tot.protein / t.protein : 0,
    carbs: t.carbs ? tot.carbs / t.carbs : 0,
    fat: t.fat ? tot.fat / t.fat : 0,
  };
  const from = ui.lastDate === k && ui.lastPct ? ui.lastPct : { kcal: 0, protein: 0, carbs: 0, fat: 0 };
  v.innerHTML = `
    <header class="day-head">
      <button class="icon-btn" type="button" data-act="prev" aria-label="前一天">${ICON.chevL}</button>
      <button class="date-title" type="button" data-act="today" aria-label="回到今天">

    ${trackSVG(t, tot, pct, from)}
    <p class="summary"><span class="swatch" style="background:var(--kcal)"></span>　已吃 <b class="num">${fmt(tot.kcal)}</b> / 目標 <span class="num">${fmt(t.kcal)}</span> kcal</p>
    <div class="macros">
      ${macroRow('protein', '蛋白質', tot.protein, t.protein, true)}
      ${macroRow('carbs', '碳水化合物', tot.carbs, t.carbs)}
      ${macroRow('fat', '脂肪', tot.fat, t.fat)}
    </div>
    ${mealsHTML(k, entries)}

  `;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('.lane-fill', v).forEach(p => {
      p.style.strokeDashoffset = p.dataset.to;
      if (p.dataset.zero === '1') p.style.opacity = '0';
    });
  }));
  ui.lastPct = pct; ui.lastDate = k;
}
function macroRow(key, name, got, target, isMin) {
  const diff = target - got;
  let txt, cls = '';
  if (isMin) {
    if (diff <= 0) { txt = '✓ 已達標'; cls = 'done'; } else txt = `還差 ${fmt(diff)} g`;
  } else {
    if (diff < 0) { txt = `⚠ 超出 ${fmt(-diff)} g`; cls = 'over'; } else txt = `還剩 ${fmt(diff)} g`;
  }
  const w = target ? Math.min(100, got / target * 100) : 0;
  return `<div class="macro">
    <span class="swatch" style="background:var(--${key})"></span>
    <span class="m-name">${name}</span>
    <span class="m-val num"><b>${fmt(got)}</b> / ${fmt(target)} g</span>
    <span class="m-bar"><i style="width:${w.toFixed(1)}%;background:var(--${key})"></i></span>
    <span class="m-left ${cls}">${txt}</span>
  </div>`;
}
function mealsHTML(k, entries) {
  if (!entries.length) {
    return `<div class="section-title"><h2>餐點</h2></div>
      <div class="empty"><p>${k === todayKey() ? '今天' : '這天'}還沒有紀錄。</p>
      <button class="btn" type="button" data-act="add">新增第一餐</button></div>`;
  }
  return MEALS.map(([m, label]) => {
    const list = entries.filter(e => e.meal === m);
    if (!list.length) return '';
    const sum = list.reduce((s, e) => s + entryTotals(e).kcal, 0);
    return `<div class="section-title"><h2>${label}</h2><span class="num">${fmt(sum)} kcal</span></div>
      <div class="list">${list.map(entryHTML).join('')}</div>`;
  }).join('');
}
function entryHTML(e) {
  const x = entryTotals(e), p = Number(e.portion) || 1;
  return `<button class="entry" type="button" data-entry="${esc(e.id)}">
    <span class="e-name">${esc(e.name)}</span>
    <span class="e-kcal num">${fmt(x.kcal)}<small> kcal</small></span>
    <span class="e-sub">
      ${e.brand ? `<span>${esc(e.brand)}</span>` : ''}
      ${p !== 1 ? `<span>${fmt1(p)} 份</span>` : ''}
      <span>${macroLine(x)}</span>
      <span class="tag ${e.source === 'ai' ? 'est' : 'solid'}">${SOURCE_LABEL[e.source] || '手動'}</span>
    </span>
  </button>`;
}
function weekHTML(k, t) {
  const days = [...Array(7)].map((_, i) => addDays(k, i - 6));
  const vals = days.map(d => dayTotals(d).kcal);
  const max = Math.max(t.kcal, ...vals) * 1.18 || 1;
  const top = 22, bot = 122, H = bot - top, x0 = 6, W = 328, slot = W / 7, bw = 20;
  const y = val => bot - (val / max) * H;
  const ty = y(t.kcal);
  let bars = '';
  days.forEach((d, i) => {
    const cx = x0 + slot * i + slot / 2, val = vals[i], sel = d === k, yy = y(val), x = cx - bw / 2;
    const cls = `w-bar${sel ? '' : ' dim'}`;
    let shape = '';
    if (val > 0) {
      const h = bot - yy;
      shape = h > 4
        ? `<path class="${cls}" d="M${x} ${bot}V${yy + 4}Q${x} ${yy} ${x + 4} ${yy}H${x + bw - 4}Q${x + bw} ${yy} ${x + bw} ${yy + 4}V${bot}Z"/>`
        : `<rect class="${cls}" x="${x}" y="${yy}" width="${bw}" height="${h}"/>`;
    }
    const dd = parseKey(d);
    bars += `<g class="w-day" data-date="${d}" role="button" tabindex="0" aria-label="${dd.getMonth() + 1}月${dd.getDate()}日，${fmt(val)} 大卡">
      <title>${shortDate(d)}　${fmt(val)} kcal</title>
      <rect x="${(x0 + slot * i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="150" fill="transparent"/>
      ${shape}
      ${sel && val > 0 ? `<text class="w-val num" x="${cx}" y="${(yy - 6).toFixed(1)}">${fmt(val)}</text>` : ''}
      <text class="w-label${sel ? ' sel' : ''}" x="${cx}" y="142">${WD[dd.getDay()]}</text>
    </g>`;
  });
  return `<div class="section-title"><h2>最近 7 天</h2><span class="hint">點長條切換日期</span></div>
    <div class="list week"><svg viewBox="0 0 340 150" role="group" aria-label="最近 7 天熱量">
      <line class="w-base" x1="${x0}" x2="${x0 + W}" y1="${bot}" y2="${bot}"/>
      <line class="w-target" x1="${x0}" x2="${x0 + W}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}"/>
      ${bars}
      <text class="w-tlabel" x="${x0 + 2}" y="${(ty - 6).toFixed(1)}">目標 ${fmt(t.kcal)}</text>
    </svg></div>`;
}

function fileToJpeg(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', 0.82);
      resolve({ dataUrl, b64: dataUrl.split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('讀不到這張照片，換一張試試。')); };
    img.src = url;
  });
}

/* ---------- Gemini ---------- */
class AppError extends Error {}
async function gemini(parts, schema) {
  const key = getKey();
  if (!key) throw new AppError('還沒設定 Gemini 金鑰，請到「設定」貼上。');
  const model = (state.settings.model || DEFAULT_MODEL).trim().replace(/^models\//, '');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 90000);
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents: [{ role: 'user', parts }],
        generationConfig: { responseMimeType: 'application/json', responseSchema: schema, temperature: 0.2 },
      }),
      signal: ctrl.signal,
    });
  } catch (e) {
    throw new AppError(e.name === 'AbortError' ? 'Gemini 太久沒回應，請再試一次。' : '連不上 Gemini，請確認網路連線。');
  } finally { clearTimeout(timer); }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const msg = (data && data.error && data.error.message) || '';
    if (res.status === 400 && /api key/i.test(msg)) throw new AppError('金鑰無效，請到「設定」重新貼上。');
    if (res.status === 400) throw new AppError('Gemini 拒絕了這次請求：' + msg.slice(0, 140));
    if (res.status === 401 || res.status === 403) throw new AppError('這把金鑰沒有權限，或金鑰的網站限制擋住了這個網址。');
    if (res.status === 404) throw new AppError(model === DEFAULT_MODEL
      ? `找不到模型「${model}」，Google 可能改了名稱，請到「設定」換一個模型名稱。`
      : `找不到模型「${model}」，請到「設定」改回 ${DEFAULT_MODEL}。`);
    if (res.status === 429) throw new AppError('使用額度暫時用完了（每分鐘或每日上限），稍等一下再試。');
    throw new AppError(`Gemini 伺服器出錯（${res.status}），稍後再試。`);
  }
  const cand = data && data.candidates && data.candidates[0];
  if (!cand) {
    const blocked = data && data.promptFeedback && data.promptFeedback.blockReason;
    throw new AppError(blocked ? '這張照片被 Gemini 的安全機制擋下，換一張試試。' : 'Gemini 沒有回傳內容，請再試一次。');
  }
  const text = ((cand.content && cand.content.parts) || []).filter(p => p.text && !p.thought).map(p => p.text).join('');
  const obj = parseJSONLoose(text);
  if (!obj) throw new AppError('看不懂 AI 回傳的格式，請再試一次，或改用手動輸入。');
  return obj;
}
function parseJSONLoose(t) {
  if (!t) return null;
  try { return JSON.parse(t); } catch (e) {}
  const m = t.replace(/```(?:json)?/g, '').match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  return null;
}

function normalizeMealItem(it, foods) {
  const est = { kcal: n0(it.kcal), protein: n0(it.protein), carbs: n0(it.carbs), fat: n0(it.fat) };
  const match = it.library_id ? foods.find(f => f.id === String(it.library_id).trim()) : null;
  if (match) {
    return {
      on: true, name: match.name, brand: match.brand || '', serving: match.serving || '',
      portion: clampPortion(n0(it.library_portion) || 1),
      kcal: n0(match.kcal), protein: n0(match.protein), carbs: n0(match.carbs), fat: n0(match.fat),
      source: 'library', foodId: match.id, note: `每份 ${cleanServing(match.serving)}`,
    };
  }
  return {
    on: true, name: String(it.name || '未命名食物').slice(0, 60), brand: String(it.brand || '').slice(0, 40),
    serving: String(it.portion_note || ''), portion: 1, ...est,
    source: 'ai', confidence: it.confidence || '', note: String(it.portion_note || ''),
  };
}
function reviewItemHTML(it, i) {
  const tag = it.source === 'library'
    ? '<span class="tag solid">食物庫數據</span>'
    : `<span class="tag est">AI 估算${it.confidence ? `（信心${esc(it.confidence)}）` : ''}</span>`;
  return `<div class="ritem${it.on ? '' : ' off'}" data-i="${i}">
    <div class="ritem-head">
      <input type="checkbox" class="chk" ${it.on ? 'checked' : ''} aria-label="包含 ${esc(it.name)}">
      <div><div class="e-name">${esc(it.name)}</div>
        <div class="ritem-meta">${[it.brand, it.note].filter(Boolean).map(esc).join('，')}</div></div>
      ${tag}
    </div>
    <div class="ritem-foot"><span class="num ritem-kcal"></span>${stepperHTML(it.portion)}</div>
    <div class="hint ritem-macro"></div>
    <details><summary>調整數值（1 份）</summary>${nutritionFields(it)}</details>
  </div>`;
}
function bindReview(el, items) {
  const refresh = () => {
    let sum = 0;
    items.forEach((it, i) => {
      const row = $(`.ritem[data-i="${i}"]`, el), x = entryTotals(it);
      $('.ritem-kcal', row).textContent = `${fmt(x.kcal)} kcal`;
      $('.ritem-macro', row).textContent = macroLine(x);
      $('output', row).textContent = `${fmt1(it.portion)} 份`;
      row.classList.toggle('off', it.on === false);
      if (it.on !== false) sum += x.kcal;
    });
    const tot = $('[data-total]', el); if (tot) tot.textContent = fmt(sum);
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-step]'); if (!b) return;
    const row = b.closest('.ritem'); if (!row) return;
    const it = items[+row.dataset.i];
    it.portion = clampPortion(it.portion + 0.25 * Number(b.dataset.step)); refresh();
  });
  el.addEventListener('change', e => {
    if (!e.target.classList.contains('chk')) return;
    items[+e.target.closest('.ritem').dataset.i].on = e.target.checked; refresh();
  });
  el.addEventListener('input', e => {
    const f = e.target.dataset && e.target.dataset.field; if (!f) return;
    const row = e.target.closest('.ritem'); if (!row) return;
    const it = items[+row.dataset.i];
    it[f] = ['name', 'brand', 'serving'].includes(f) ? e.target.value : n0(e.target.value);
    refresh();
  });
  refresh();
}
function openMealReview(items, note, thumb, p) {

    const now = Date.now();
    addEntries(p.date, chosen.map((it, i) => ({

function upsertFoods(list, source) {
  let added = 0, updated = 0;
  const saved = list.map(it => {
    const name = it.name.trim() || '未命名食物', brand = (it.brand || '').trim();
    const data = { name, brand, serving: cleanServing(it.serving), kcal: n0(it.kcal), protein: n0(it.protein), carbs: n0(it.carbs), fat: n0(it.fat), source, updatedAt: Date.now() };
    const old = state.foods.find(f => f.name === name && (f.brand || '') === brand);
    if (old) { Object.assign(old, data); updated++; return old; }
    const f = { id: uid(), ...data }; state.foods.push(f); added++; return f;
  });
  save();
  return { saved, added, updated };
}

/* ---------- 備份 ---------- */
async function shareOrDownload(name, text) {
  const blob = new Blob([text], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportData() {
  const data = { app: APP, version: 1, exportedAt: new Date().toISOString(), profile: state.profile, settings: state.settings, foods: state.foods, log: state.log };
  shareOrDownload(`補給站備份-${todayKey()}.json`, JSON.stringify(data));
}
function exportFoods() {
  const foods = state.foods.map(({ id, brand, name, serving, kcal, protein, carbs, fat }) => ({ id, brand, name, serving, kcal, protein, carbs, fat }));

}

      save(); ui.lastPct = null; closeSheet(); render(); toast('已匯入備份');
    } else closeSheet();
  });
});

/* ---------- 共用食物資料（foods.json） ---------- */
async function loadShared() {
  try {
    const r = await fetch('foods.json', { cache: 'no-cache' });
    if (!r.ok) return;
    const d = await r.json();
    const arr = Array.isArray(d) ? d : (d && d.foods) || [];
    sharedFoods = arr.filter(x => x && x.name).map((x, i) => ({
      id: 'shared:' + (x.id || i), brand: x.brand || '', name: String(x.name), serving: cleanServing(x.serving),
      kcal: n0(x.kcal), protein: n0(x.protein), carbs: n0(x.carbs), fat: n0(x.fat), source: 'shared',
    }));
    if (ui.tab === 'library') render();
  } catch (e) { /* 沒有 foods.json 也能正常使用 */ }
}

render();
loadShared();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
